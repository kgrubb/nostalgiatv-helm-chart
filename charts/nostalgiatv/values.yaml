# Container image. Prefer dated upstream tags (kube-linter blocks :latest).
image:
  repository: purestream711/nostalgiatv-server
  # renovate: datasource=docker depName=purestream711/nostalgiatv-server
  tag: "0.10.21-20261005-1347"
  # Optional immutable pin, e.g. sha256:b2f577c8...
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Single replica. The data PVC is RWO.
replicaCount: 1

# Recreate avoids Multi-Attach on RWO volumes during upgrades.
strategy:
  type: Recreate

# Host user/group the process drops to after chowning volume mounts.
# Match your cluster's filesystem ownership (homestead uses 100000).
# When podSecurityContext.fsGroup is unset, it defaults to pgid.
puid: 1000
pgid: 1000

timezone: America/New_York

# Schedule and content sync (see upstream Docker Hub docs).
schedule:
  # Hours of schedule to generate ahead (720 = 30 days). Range 24–2160.
  hours: 720
  # Seconds between scheduler ticks (21600 = 6 hours).
  refreshIntervalSeconds: 21600
  # Regenerate when remaining schedule falls below this many hours (168 = 7 days).
  regenThresholdHours: 168

# How often to probe media servers for content adds/removals.
contentPollIntervalSeconds: 300

hdhr:
  # HDHomeRun / M3U / XMLTV tuner emulator. Unauthenticated by design.
  enabled: true

weather:
  # Leave empty to use the key bundled in the image.
  # Prefer existingSecret in GitOps. apiKey and existingSecret are mutually exclusive.
  apiKey: ""
  existingSecret: ""
  apiKeyKey: apiKey

logLevel: INFO

# Extra environment variables injected into the container.
extraEnv: {}

serviceAccount:
  create: true
  # The pod does not need API access.
  automountServiceAccountToken: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 19850
  # Set to Local for MetalLB L2 so ARP stays on the node running the pod.
  externalTrafficPolicy: ""
  annotations: {}

# Ingress for the web UI and Android Docker Mode URL.
# Prefer a LAN LoadBalancer when hdhr.enabled is true (tuner is unauthenticated).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nostalgiatv.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional NetworkPolicy. Disabled by default so installs work without CNI policy support.
networkPolicy:
  enabled: false
  # Extra ingress peers (podSelector / namespaceSelector / ipBlock). Empty allows all namespaces.
  ingress: []
  # Extra egress rules. Empty allows all egress (needed for Jellyfin/Plex/Emby + weather).
  egress: []

# Optional PDB. Usually unnecessary for replicaCount: 1 + Recreate.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# One PVC holds data/, config/, and logos/ as subPaths.
persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  storageClass: ""
  size: 10Gi
  annotations: {}

resources: {}

podAnnotations: {}
podLabels: {}

# fsGroup defaults to pgid when omitted.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Upstream entrypoint starts as root to chown mounts, then drops to PUID.
# Leave runAsUser unset so the image can do that. Re-add the caps the drop
# to PUID and volume chown need after capabilities.drop: [ALL].
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

startupProbe:
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
