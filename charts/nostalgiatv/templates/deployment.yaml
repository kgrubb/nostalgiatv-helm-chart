apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nostalgiatv.fullname" . }}
  labels:
    {{- include "nostalgiatv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "nostalgiatv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nostalgiatv.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (eq (include "nostalgiatv.createWeatherSecret" .) "true") .Values.podAnnotations }}
      annotations:
        {{- if eq (include "nostalgiatv.createWeatherSecret" .) "true" }}
        checksum/weather-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nostalgiatv.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "nostalgiatv.podSecurityContext" . | nindent 8 }}
      containers:
        - name: nostalgiatv
          image: {{ include "nostalgiatv.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 19850
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
            - name: SCHEDULE_HOURS
              value: {{ .Values.schedule.hours | quote }}
            - name: SCHEDULE_REFRESH_INTERVAL
              value: {{ .Values.schedule.refreshIntervalSeconds | quote }}
            - name: SCHEDULE_REGEN_THRESHOLD_HOURS
              value: {{ .Values.schedule.regenThresholdHours | quote }}
            - name: PLEX_CONTENT_POLL_INTERVAL_SECONDS
              value: {{ .Values.contentPollIntervalSeconds | quote }}
            - name: HDHR_ENABLED
              value: {{ .Values.hdhr.enabled | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if or .Values.weather.existingSecret .Values.weather.apiKey }}
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nostalgiatv.weatherSecretName" . }}
                  key: {{ .Values.weather.apiKeyKey | quote }}
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/config
              subPath: config
            - name: data
              mountPath: /app/logos
              subPath: logos
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nostalgiatv.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
