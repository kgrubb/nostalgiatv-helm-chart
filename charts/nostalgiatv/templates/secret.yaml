{{- if and .Values.weather.apiKey .Values.weather.existingSecret }}
{{- fail "weather.apiKey and weather.existingSecret are mutually exclusive" }}
{{- end }}
{{- if eq (include "nostalgiatv.createWeatherSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nostalgiatv.weatherSecretName" . }}
  labels:
    {{- include "nostalgiatv.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.weather.apiKeyKey }}: {{ .Values.weather.apiKey | quote }}
{{- end }}
